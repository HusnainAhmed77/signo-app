<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-O Urdu Keyboard</title>
  <style>
    :root {
      --bg-color: #f5f2ec;
      --text-color: #2a2a2a;
      --accent-color: #d4af37;
      --card-bg: #ffffff;
      --border-color: #e0d4c4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 8px;
      min-width: 320px;
      line-height: 1.4;
    }

    h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-color);
      letter-spacing: 0.5px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .mode-btn {
      padding: 6px 10px;
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn:hover {
      border-color: var(--accent-color);
      background: #fff8e7;
    }

    .mode-btn.active {
      background: var(--accent-color);
      color: #2a2a2a;
      border-color: var(--accent-color);
    }

    .camera-wrapper {
      margin-bottom: 12px;
    }

    .camera-box {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }

    .landmarks {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    video, .landmarks {
      transform: scaleX(-1); /* selfie view; inference uses the unmirrored frame */
    }

    .action-btn.primary-wide {
      flex-basis: 100%;
      font-weight: 600;
    }

    .top3 {
      font-size: 11px;
      color: #666;
      margin-top: 6px;
      white-space: pre-line;
    }

    .hidden {
      display: none !important;
    }

    .landmark-point {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #ff7a2f;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    .landmark-connection {
      position: absolute;
      background: #ff7a2f;
      border-radius: 2px;
    }

    .prediction-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      min-height: 40px;
    }

    .prediction-text {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-color);
      min-height: 1.2em;
    }

    .prediction-desc {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }

    .buttons-panel {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-btn {
      flex: 1;
      min-width: 80px;
      padding: 8px 12px;
      background: var(--accent-color);
      color: #2a2a2a;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .action-btn:not(:disabled):hover {
      opacity: 0.9;
    }

    .action-btn.secondary {
      background: #e0e0e0;
      color: var(--text-color);
    }

    .status-bar {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
      font-size: 11px;
      color: #666;
    }

    .hint {
      font-size: 10px;
      color: #888;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h3>Sign-O ⋅ Urdu Keyboard</h3>

  <div class="toolbar">
    <button class="mode-btn active" data-mode="pinch">Pinch to Type</button>
    <button class="mode-btn" data-mode="mouse">Mouse Click</button>
    <button class="mode-btn" data-mode="dwell">Dwell (auto)</button>
  </div>

  <div class="camera-wrapper">
    <div class="camera-box">
      <video id="cameraFeed" autoplay muted playsinline></video>
      <canvas class="landmarks" id="landmarksOverlay"></canvas>
    </div>
    <button class="action-btn hidden" id="cameraPermissionBtn" style="margin-top:8px;width:100%">Allow camera access</button>
    <div class="hint">Focus a text box on the page first, then show one hand clearly.</div>
  </div>

  <div class="prediction-panel">
    <div class="prediction-text" id="predictionDisplay" dir="rtl">— — —</div>
    <div class="prediction-desc" id="predictionDesc">Loading models…</div>
    <div class="top3" id="top3"></div>
  </div>

  <div class="buttons-panel">
    <button class="action-btn primary-wide" id="typeBtn" disabled>Type letter</button>
    <button class="action-btn secondary" id="spaceBtn">Space</button>
    <button class="action-btn secondary" id="backspaceBtn">← Backspace</button>
    <button class="action-btn secondary" id="clearBtn">Clear field</button>
  </div>

  <div class="status-bar">
    <span id="statusText">Starting…</span>
  </div>

  <div class="hint" id="modeHint"></div>

  <script src="lib/onnxruntime/ort.wasm.min.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
