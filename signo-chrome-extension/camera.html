<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-O camera access</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f2ec;
      color: #2a2a2a;
      max-width: 520px;
      margin: 48px auto;
      padding: 0 16px;
      line-height: 1.5;
    }
    button {
      padding: 10px 16px;
      background: #d4af37;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #status { margin-top: 16px; font-weight: 500; }
    .ok { color: #2e7d32; }
    .err { color: #c62828; }
  </style>
</head>
<body>
  <h2>Allow Sign-O to use your camera</h2>
  <p>Chrome cannot always show the camera permission prompt inside the extension panel, so Sign-O asks for it here once. Video stays on your computer and is never uploaded.</p>
  <button id="grantBtn">Allow camera</button>
  <p id="status"></p>
  <script src="camera.js"></script>
</body>
</html>
